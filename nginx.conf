# Cogniflux 静态站点（React Router prerender，每路由目录 + index.html）
# HTTPS：证书由 certbot 在宿主机签发，运行时挂载 /etc/letsencrypt 进容器。
# 关键：禁止 SPA fallback——不存在的路径直达 404 预渲染页，而非兜底 index.html。

# 1) HTTP：整站 301 → https://cogniflux.me（续期走 standalone，无需 acme-challenge）
server {
    listen 80;
    server_name cogniflux.me www.cogniflux.me;
    return 301 https://cogniflux.me$request_uri;
}

# 2) HTTPS www：先握手（同一张证书含 www），再 301 → 裸域名
server {
    listen 443 ssl;
    http2 on;
    server_name www.cogniflux.me;

    ssl_certificate /etc/letsencrypt/live/cogniflux.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cogniflux.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://cogniflux.me$request_uri;
}

# 3) HTTPS 裸域名：站点主体，完整保留原静态托管规则
server {
    listen 443 ssl;
    http2 on;
    server_name cogniflux.me;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/cogniflux.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cogniflux.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS（仅裸域名 443）
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # 预渲染 404 页（build/client/404/index.html）
    error_page 404 /404/index.html;

    # ===== 私密内容口令门（ADR-010）：auth_request 复用 Workspace 登录态 =====
    # 私密文章 HTML（/writing/p-*）：401/403 → 302 重定向到提示页。
    # 不用内容改写（=401 返提示页 HTML）：URL 仍是文章路径，React Router
    # 水合时按 URL 匹配文章路由，与提示页 HTML 不符会落入错误边界。
    location ^~ /writing/p- {
        auth_request /__auth;
        # 必须用绝对 URL：相对 URI 在 error_page 中是内部重定向（302 无 Location 头）
        error_page 401 403 =302 https://cogniflux.me/private-notice/;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # 私密文章 JS chunk（构建期隔离到 assets/private/，见 vite.config.ts）：
    # 不给 immutable 长缓存——no-store 防私密内容进共享缓存
    # 资源请求无水合问题，不配 error_page——直接返 401 裸响应（HTML 提示页对资源请求无意义）
    location ^~ /assets/private/ {
        auth_request /__auth;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 私密文章插图（public/images/private/{slug}/，构建原样拷入 build/client/images/private/）：
    # ^~ 前缀优先于正则与 location /，同 assets/private 口令门；no-store 防私密图片进共享缓存
    # 同 assets/private：无 error_page，401 裸响应
    location ^~ /images/private/ {
        auth_request /__auth;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # auth_request 子请求：转发 Cookie 到 twinspark /api/v1/auth/me（2xx 放行，401/403 拦截）
    # 与 /api/ 反代同款惰性解析：twinspark 未启动不影响 nginx 启动与公开内容
    location = /__auth {
        internal;
        resolver 127.0.0.11 valid=30s;
        set $twinspark_upstream http://twinspark:8000;
        proxy_pass $twinspark_upstream/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # 带 hash 的构建资源：长缓存 + immutable
    # 注：location 内出现 add_header 会屏蔽 server 层继承，故重复 HSTS
    # （^~ /assets/private/ 前缀更长，优先于本规则命中，公开资源行为不变）
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML 不缓存，保证发布后即时生效
    location ~* \.html$ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
    }

    # Workspace 后端反代（twinspark 容器，同 docker network cogniflux-net）
    # 关键：用变量 + docker 内置 DNS（127.0.0.11）惰性解析主机名，
    # twinspark 容器未启动时 nginx 仍可正常启动，仅 API 请求返 502，静态站不受影响
    resolver 127.0.0.11 valid=30s;

    # 前端实时事件流（WS 升级，长连接 24h）
    location /api/v1/realtime {
        set $twinspark_upstream http://twinspark:8000;
        proxy_pass $twinspark_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 本机 Daemon 接入通道（WS 升级，长连接 24h）
    location /api/v1/daemon/ws {
        set $twinspark_upstream http://twinspark:8000;
        proxy_pass $twinspark_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # 普通 HTTP API 反代（REST，/api/v1/...）
    location /api/ {
        set $twinspark_upstream http://twinspark:8000;
        proxy_pass $twinspark_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # 路由直达：/writing/xxx → /writing/xxx/index.html；无匹配则 404
    location / {
        try_files $uri $uri/index.html =404;
    }
}
